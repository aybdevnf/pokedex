<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Pokedex</title>
</head>
<body>
  <div class="container">
    <div class="main">
      <div class="title-container">
        <h1 class="title">Pokedex</h1>
        <hr>
        <span class="description">Search for a pokemon</span>
      </div>
      <div class="controls">
        <div class="search-container">
          <div class="input-container">
            <input type="text" class="pokemon-name" placeholder="pokemon name">
          </div>
          <button class="search-btn">Search</button>
        </div>
      </div>
    </div>
      <hr class="diviser">
    <div class="pokemon-info">Pokemon Infos</div>
  </div>
  <script src="main.js"></script>
</body>
</html>
